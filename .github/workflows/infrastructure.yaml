name: Infrastructure

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy from main
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  validate:
    name: Validate Kustomize overlays
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          version=v1.34.3
          base_url="https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location "$base_url" -o "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location "${base_url}.sha256" -o "$RUNNER_TEMP/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Render both environments
        run: |
          kubectl kustomize infrastructure/overlays/dev > /dev/null
          kubectl kustomize infrastructure/overlays/prod > /dev/null
          bash -n infrastructure/scripts/load-data.sh

  deploy-dev:
    name: Deploy dev to Minikube
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev'))
    runs-on: [self-hosted, Linux, X64, irco-minikube]
    environment: dev
    concurrency:
      group: infrastructure-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply dev overlay
        run: |
          kubectl --context=minikube apply -k infrastructure/overlays/dev
          kubectl --context=minikube -n dev rollout status statefulset/postgres --timeout=5m

  deploy-prod:
    name: Deploy prod to Minikube
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'prod'
    runs-on: [self-hosted, Linux, X64, irco-minikube]
    environment: prod
    concurrency:
      group: infrastructure-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Apply prod overlay
        run: |
          kubectl --context=minikube apply -k infrastructure/overlays/prod
          kubectl --context=minikube -n prod rollout status statefulset/postgres --timeout=5m
